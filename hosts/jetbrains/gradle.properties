## Plugin identity
pluginGroup           = dev.oxp
pluginName            = oxp-jetbrains
pluginVersion         = 0.1.0

## Compatibility — IntelliJ Platform 2025.1 (build 251) and newer.
## All flagship JetBrains IDEs on platform 251+ install from the same artifact.
## Android Studio is intentionally excluded for now; Google's fork lags ~2 platform releases.
pluginSinceBuild      = 251

## Tooling
platformType          = IC
platformVersion       = 2025.1
kotlinVersion         = 2.1.0
gradleVersion         = 8.10

## JVM
javaVersion           = 21

## Gradle
org.gradle.jvmargs    = -Xmx4g -XX:+UseG1GC
org.gradle.parallel   = true
org.gradle.caching    = true
kotlin.stdlib.default.dependency = false
