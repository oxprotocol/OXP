name: publish

# Zero-friction marketplace publish pipeline.
#
# Trigger:
#   - `v*.*.*` tag push: builds every artefact and publishes to each
#     marketplace whose credential secret is present. Missing secrets
#     simply skip that publish step (no failure) so you can wire up the
#     marketplaces one at a time.
#   - `workflow_dispatch`: same logic, manual button.
#
# Secrets consumed (all optional — missing secret = skip that marketplace):
#   VSCE_PAT                  → VS Code Marketplace  (publisher: oxprotocol)
#   OVSX_PAT                  → Open VSX             (publisher: oxprotocol)
#   JETBRAINS_PAT             → JetBrains Marketplace (vendor: oxp.sh)
#   NPM_TOKEN                 → npm                  (@oxprotocol/cli)
#
# Add a secret in: Repo → Settings → Secrets and variables → Actions → New repository secret.
# Tokens are evaluated at the start of the run; each publish job is gated
# on the corresponding `has_*` output of the `guard` job so missing
# tokens silently skip without failing the workflow.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -- 0. Inspect which secrets are configured ------------------------------
  guard:
    name: detect available credentials
    runs-on: ubuntu-24.04
    outputs:
      has_vsce: ${{ steps.detect.outputs.has_vsce }}
      has_ovsx: ${{ steps.detect.outputs.has_ovsx }}
      has_jb: ${{ steps.detect.outputs.has_jb }}
      has_npm: ${{ steps.detect.outputs.has_npm }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: detect
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          JETBRAINS_PAT: ${{ secrets.JETBRAINS_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          [[ -n "${VSCE_PAT:-}" ]] && out has_vsce true || out has_vsce false
          [[ -n "${OVSX_PAT:-}" ]] && out has_ovsx true || out has_ovsx false
          [[ -n "${JETBRAINS_PAT:-}" ]] && out has_jb true || out has_jb false
          [[ -n "${NPM_TOKEN:-}" ]] && out has_npm true || out has_npm false
      - id: version
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME:-}"
          v="${ref#v}"
          if [[ -z "$v" ]]; then v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $v"

  # -- 1. Cross-compile oxp-runtime for all six triples ---------------------
  build-runtime:
    name: build runtime (${{ matrix.triple }})
    needs: guard
    if: ${{ needs.guard.outputs.has_jb == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              triple: aarch64-apple-darwin,
              runner: macos-14,
              plugin: macos-aarch64,
              exe: oxp-runtime,
            }
          - {
              triple: x86_64-apple-darwin,
              runner: macos-14,
              plugin: macos-x86_64,
              exe: oxp-runtime,
            }
          - {
              triple: aarch64-unknown-linux-gnu,
              runner: ubuntu-24.04,
              plugin: linux-aarch64,
              exe: oxp-runtime,
            }
          - {
              triple: x86_64-unknown-linux-gnu,
              runner: ubuntu-24.04,
              plugin: linux-x86_64,
              exe: oxp-runtime,
            }
          - {
              triple: aarch64-pc-windows-msvc,
              runner: windows-2022,
              plugin: windows-aarch64,
              exe: oxp-runtime.exe,
            }
          - {
              triple: x86_64-pc-windows-msvc,
              runner: windows-2022,
              plugin: windows-x86_64,
              exe: oxp-runtime.exe,
            }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.triple }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: runtime }
      - name: install zig (Linux/macOS)
        if: runner.os != 'Windows'
        uses: mlugg/setup-zig@v1
        with: { version: 0.13.0 }
      - name: install cargo-zigbuild (Linux/macOS)
        if: runner.os != 'Windows'
        run: cargo install --locked cargo-zigbuild
      - name: build (Linux/macOS — zigbuild)
        if: runner.os != 'Windows'
        working-directory: runtime
        run: cargo zigbuild --release --target ${{ matrix.triple }}
      - name: build (Windows — native)
        if: runner.os == 'Windows'
        working-directory: runtime
        run: cargo build --release --target ${{ matrix.triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.plugin }}
          path: runtime/target/${{ matrix.triple }}/release/${{ matrix.exe }}
          if-no-files-found: error

  # -- 2. Package + publish JetBrains plugin --------------------------------
  publish-jetbrains:
    name: publish JetBrains plugin
    needs: [guard, build-runtime]
    if: ${{ needs.guard.outputs.has_jb == 'true' }}
    runs-on: ubuntu-24.04
    environment: jetbrains-marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: download runtime artefacts
        uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: "runtime-*" }
      - name: stage runtime binaries into plugin
        run: |
          set -euo pipefail
          for d in artifacts/runtime-*; do
            triple="${d#artifacts/runtime-}"
            dest="hosts/jetbrains/runtime-bin/$triple"
            mkdir -p "$dest"
            cp "$d"/* "$dest/"
            chmod +x "$dest"/* 2>/dev/null || true
          done
      - name: gradle publishPlugin
        working-directory: hosts/jetbrains
        env:
          ORG_GRADLE_PROJECT_intellijPublishToken: ${{ secrets.JETBRAINS_PAT }}
        run: ./gradlew --no-daemon publishPlugin -x buildSearchableOptions

  # -- 3. Package VS Code extension once, reuse for both marketplaces -------
  package-vscode:
    name: package VS Code extension
    needs: guard
    if: ${{ needs.guard.outputs.has_vsce == 'true' || needs.guard.outputs.has_ovsx == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      vsix-name: ${{ steps.locate.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm }
      - name: install workspace deps
        run: pnpm install --frozen-lockfile
      - name: build workspace packages
        run: pnpm -r --filter "./packages/**" build
      - name: build VS Code bundle
        working-directory: hosts/vscode
        run: pnpm build
      - name: package .vsix
        working-directory: hosts/vscode
        run: pnpm dlx @vscode/vsce@latest package --no-dependencies --allow-missing-repository
      - id: locate
        working-directory: hosts/vscode
        run: |
          set -euo pipefail
          vsix=$(ls *.vsix | head -n1)
          echo "name=$vsix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: hosts/vscode/*.vsix
          if-no-files-found: error

  publish-vsce:
    name: publish to VS Code Marketplace
    needs: [guard, package-vscode]
    if: ${{ needs.guard.outputs.has_vsce == 'true' }}
    runs-on: ubuntu-24.04
    environment: vscode-marketplace
    steps:
      - uses: actions/download-artifact@v4
        with: { name: vscode-extension, path: dist }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          vsix=$(ls dist/*.vsix | head -n1)
          npx -y @vscode/vsce@latest publish --packagePath "$vsix" -p "$VSCE_PAT"

  publish-ovsx:
    name: publish to Open VSX
    needs: [guard, package-vscode]
    if: ${{ needs.guard.outputs.has_ovsx == 'true' }}
    runs-on: ubuntu-24.04
    environment: open-vsx
    steps:
      - uses: actions/download-artifact@v4
        with: { name: vscode-extension, path: dist }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: ovsx publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          vsix=$(ls dist/*.vsix | head -n1)
          npx -y ovsx@latest publish "$vsix" -p "$OVSX_PAT"

  # -- 4. Publish all public npm packages (CLI + its workspace deps) -------
  # @oxprotocol/cli depends on @oxprotocol/{bundle,host-core,schema,types,wit}
  # via `workspace:*`. `pnpm -r publish` publishes every non-private package
  # in topological order, rewriting `workspace:*` to fixed versions so
  # end-user `npm i -g @oxprotocol/cli` actually resolves.
  publish-npm:
    name: publish npm packages
    needs: guard
    if: ${{ needs.guard.outputs.has_npm == 'true' }}
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - name: build all packages
        run: pnpm -r --filter "./packages/**" build
      - name: configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
      - name: pnpm publish @oxprotocol/* packages (topological, rewrites workspace:*)
        run: pnpm -r --filter "@oxprotocol/*" publish --no-git-checks --access public

  # -- 5. Summary -----------------------------------------------------------
  summary:
    name: summary
    needs: [guard, publish-jetbrains, publish-vsce, publish-ovsx, publish-npm]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: write summary
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          HAS_VSCE: ${{ needs.guard.outputs.has_vsce }}
          HAS_OVSX: ${{ needs.guard.outputs.has_ovsx }}
          HAS_JB: ${{ needs.guard.outputs.has_jb }}
          HAS_NPM: ${{ needs.guard.outputs.has_npm }}
          R_VSCE: ${{ needs.publish-vsce.result }}
          R_OVSX: ${{ needs.publish-ovsx.result }}
          R_JB: ${{ needs.publish-jetbrains.result }}
          R_NPM: ${{ needs.publish-npm.result }}
        run: |
          {
            echo "# OXP publish v$VERSION"
            echo
            echo "| Target | Token configured | Job result |"
            echo "|---|---|---|"
            echo "| VS Code Marketplace | $HAS_VSCE | $R_VSCE |"
            echo "| Open VSX            | $HAS_OVSX | $R_OVSX |"
            echo "| JetBrains Marketplace | $HAS_JB | $R_JB |"
            echo "| npm packages         | $HAS_NPM | $R_NPM |"
          } >> "$GITHUB_STEP_SUMMARY"
