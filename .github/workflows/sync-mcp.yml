name: Sync MCP registry

# Crawls every public MCP server source (official registry, github
# modelcontextprotocol/servers, npm keyword search, mcp.so, glama.ai) and
# refreshes apps/web/lib/mcp-servers.json. Runs daily at 06:00 UTC and commits
# directly to main if anything changed. Also runnable manually from the Actions tab.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Crawl MCP sources
        working-directory: apps/web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm sync:mcp

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/mcp-servers.json
          if git diff --staged --quiet; then
            echo "mcp-servers.json unchanged — nothing to commit"
          else
            git commit -m "chore(mcp): sync registry snapshot [skip ci]"
            git push
          fi
